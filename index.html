<style>
/* Layout: single-column centered, flip card business card */
:root {
  --bg:         #EFF3FA;
  --surface:    #FFFFFF;
  --navy:       #1C3D7A;
  --navy-deep:  #122A56;
  --accent:     #2E6FD6;
  --accent-soft:#E4EDF9;
  --gold:       #C49A2F;
  --fg:         #111827;
  --fg-mid:     #374163;
  --muted:      #7C8DB5;
  --border:     #CBD8EE;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0C1221;
    --surface:    #152038;
    --navy:       #2555A8;
    --navy-deep:  #1A3D80;
    --accent:     #5B93E8;
    --accent-soft:#1A2E50;
    --gold:       #D4A93A;
    --fg:         #E8F0FF;
    --fg-mid:     #9EB0D8;
    --muted:      #546988;
    --border:     #233558;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:         #0C1221;
  --surface:    #152038;
  --navy:       #2555A8;
  --navy-deep:  #1A3D80;
  --accent:     #5B93E8;
  --accent-soft:#1A2E50;
  --gold:       #D4A93A;
  --fg:         #E8F0FF;
  --fg-mid:     #9EB0D8;
  --muted:      #546988;
  --border:     #233558;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans TC', 'Outfit', system-ui, sans-serif;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-block: 2.5rem;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 1.5rem;
}

/* ── Page heading ── */
.page-label {
  font-family: 'Outfit', sans-serif;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Flip scene ── */
.scene {
  width: 100%;
  max-width: 400px;
  aspect-ratio: 85 / 54;
  perspective: 1200px;
}

.flip {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.4, 0, .2, 1);
}

.scene.show-back .flip { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  box-shadow:
    0 2px 8px rgba(0,0,0,.08),
    0 12px 40px rgba(0,0,0,.14),
    0 24px 56px rgba(0,0,0,.08);
}

/* ═══════════════════════════════════════
   FRONT
═══════════════════════════════════════ */
.front {
  background: linear-gradient(150deg, var(--navy-deep) 0%, var(--navy) 60%, #2060B8 100%);
  display: flex;
  flex-direction: column;
}

/* gold top rail */
.front::before {
  content: '';
  display: block;
  height: 3.5px;
  background: linear-gradient(90deg, var(--gold) 0%, rgba(196,154,47,.2) 100%);
  flex-shrink: 0;
}

.front-body {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 1.1rem 1.4rem;
  gap: 1.1rem;
}

/* Avatar circle */
.avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
  border: 2px solid rgba(255,255,255,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
}

.avatar-initials {
  font-family: 'Outfit', sans-serif;
  font-size: 1.7rem;
  font-weight: 600;
  color: rgba(255,255,255,.9);
  line-height: 1;
  letter-spacing: -.01em;
}

/* No cross overlay when showing QR image */
.avatar::after { display: none; }

.name-block { flex: 1; min-width: 0; }

.name-en {
  font-family: 'Outfit', sans-serif;
  font-size: 1.35rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: .01em;
  line-height: 1.1;
}

.name-zh {
  font-size: .78rem;
  color: rgba(255,255,255,.65);
  margin-top: .15rem;
  letter-spacing: .03em;
}

.role-pill {
  display: inline-block;
  margin-top: .55rem;
  padding: .18rem .6rem;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 100px;
  font-family: 'Outfit', sans-serif;
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: rgba(255,255,255,.8);
}

.front-footer {
  background: rgba(0,0,0,.22);
  padding: .6rem 1.4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.school-block { display: flex; flex-direction: column; gap: .05rem; }

.school-name {
  font-size: .72rem;
  font-weight: 500;
  color: rgba(255,255,255,.88);
  letter-spacing: .02em;
}

.dept-name {
  font-size: .62rem;
  color: rgba(255,255,255,.52);
}

/* Medical cross icon */
.cross-icon {
  width: 28px;
  height: 28px;
  opacity: .7;
}

/* ═══════════════════════════════════════
   BACK
═══════════════════════════════════════ */
.back {
  background: var(--surface);
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
  padding: .95rem 1.25rem .85rem;
  gap: .7rem;
}

.back-label {
  font-family: 'Outfit', sans-serif;
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}

.contact-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .5rem 1rem;
  align-items: start;
}

.contacts { display: flex; flex-direction: column; gap: .45rem; }

.c-item {
  display: flex;
  align-items: flex-start;
  gap: .45rem;
}

.c-icon {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

.c-icon svg {
  width: 11px;
  height: 11px;
  fill: var(--accent);
}

.c-text { display: flex; flex-direction: column; }

.c-label {
  font-family: 'Outfit', sans-serif;
  font-size: .56rem;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1;
}

.c-val {
  font-family: 'Outfit', sans-serif;
  font-size: .68rem;
  color: var(--fg);
  margin-top: .1rem;
  word-break: break-all;
  line-height: 1.3;
}

/* QR code box */
.qr-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .3rem;
}

#qrcode canvas { border-radius: 5px; display: block; }

.qr-hint {
  font-family: 'Outfit', sans-serif;
  font-size: .56rem;
  color: var(--muted);
  text-align: center;
}

/* Social + flip hint */
.back-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: .55rem;
  border-top: 1px solid var(--border);
}

.socials { display: flex; gap: .35rem; }

.social-btn {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: background .18s, transform .15s;
  cursor: pointer;
  border: none;
}

.social-btn:hover { background: var(--accent); transform: translateY(-1px); }
.social-btn:hover svg { fill: #fff; }

.social-btn svg {
  width: 12px;
  height: 12px;
  fill: var(--accent);
  transition: fill .18s;
  display: block;
}

.flip-hint-text {
  font-family: 'Outfit', sans-serif;
  font-size: .58rem;
  color: var(--muted);
}

/* ── Controls ── */
.controls {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .48rem 1.1rem;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--fg-mid);
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 500;
  cursor: pointer;
  transition: border-color .18s, color .18s, background .18s, transform .15s;
}

.btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

.btn-primary {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* ── Design tips section ── */
.tips-wrap {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1rem 1.2rem;
}

.tips-title {
  font-family: 'Outfit', sans-serif;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .65rem;
}

.tip-item {
  display: flex;
  gap: .55rem;
  align-items: flex-start;
  margin-bottom: .55rem;
}

.tip-item:last-child { margin-bottom: 0; }

.tip-num {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-size: .65rem;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}

.tip-text {
  font-size: .72rem;
  color: var(--fg-mid);
  line-height: 1.5;
}

.tip-text strong {
  color: var(--fg);
  font-weight: 600;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--fg);
  color: var(--bg);
  padding: .45rem 1.1rem;
  border-radius: 100px;
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 500;
  pointer-events: none;
  transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
  opacity: 0;
  z-index: 999;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>

<script>
  /* ── Card data — edit this to customise ── */
  const cardInfo = {
    nameEn:   'Kimmy Chao',
    nameZh:   'M.D.-Ph.D.',
    email:    'b931115003@tmu.edu.tw',
    phone:    '+886-2-2736-1661',
    org:      '不開藥的處方箋',
    dept:     '健康講座講師',
    url:      'https://im.tmu.edu.tw'
  };

  /* ── Build vCard string ── */
  const vcard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${cardInfo.nameEn}`,
    `ORG:${cardInfo.org};${cardInfo.dept}`,
    `EMAIL:${cardInfo.email}`,
    `TEL;TYPE=WORK:${cardInfo.phone}`,
    `URL:${cardInfo.url}`,
    'END:VCARD'
  ].join('\n');

  /* ── Generate QR code ── */
  document.addEventListener('DOMContentLoaded', () => {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    new QRCode(document.getElementById('qrcode'), {
      text:         vcard,
      width:        76,
      height:       76,
      colorDark:    isDark ? '#E8F0FF' : '#111827',
      colorLight:   isDark ? '#152038' : '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M
    });
  });

  /* ── Flip ── */
  function toggleFlip() {
    document.getElementById('scene').classList.toggle('show-back');
  }

  /* ── Copy email ── */
  function copyEmail() {
    const email = cardInfo.email;
    navigator.clipboard.writeText(email)
      .then(() => toast('Email 已複製到剪貼簿 ✓'))
      .catch(() => {
        // Fallback: select the element text
        const el = document.getElementById('emailVal');
        const range = document.createRange();
        range.selectNode(el);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        toast('請手動複製 Email');
      });
  }

  /* ── Show vCard info ── */
  function showVCard() {
    toast('請用手機掃描 QR Code 儲存聯絡人');
    // Flip to back to show QR
    document.getElementById('scene').classList.add('show-back');
  }

  /* ── Toast helper ── */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }
</script>
